# Production: every value comes from the environment, with no defaults, so a missing variable stops
# the API at startup instead of falling back to the development values in application.properties.
# Example: DB_URL=jdbc:postgresql://<host>:5432/<database> (add ?sslmode=require when the database requires TLS)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret=${JWT_SECRET}
