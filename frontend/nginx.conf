server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/subjects -> http://api:8080/subjects ("api" é o nome do serviço no docker-compose.yml)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
