server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/subjects -> http://api:8080/subjects ("api" is the service name in docker-compose.yml)
    location /api/ {
        proxy_pass http://api:8080/;
        # $http_host keeps the port (localhost:3000), so Spring sees the same origin as the
        # browser and skips CORS; $host drops it and every POST/PATCH failed with 403.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
