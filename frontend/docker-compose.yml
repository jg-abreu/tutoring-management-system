# Runs the client on http://localhost:3000 against an API on the host (port 8080).
# Start the API first: in tutoring-management-api, run docker compose up --build.

services:
  frontend:
    build: .
    environment:
      API_URL: ${API_URL:-http://host.docker.internal:8080}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop already provides it)
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"
