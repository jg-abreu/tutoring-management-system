name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tutoring
          POSTGRES_USER: tutoring
          POSTGRES_PASSWORD: tutoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutoring -d tutoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tutoring
      SPRING_DATASOURCE_USERNAME: tutoring
      SPRING_DATASOURCE_PASSWORD: tutoring

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Hibernate runs with ddl-auto=validate, so the schema must exist before the context loads
      - name: Load database schema
        run: psql -h localhost -U tutoring -d tutoring -v ON_ERROR_STOP=1 -f docker/postgres/init/01-schema.sql
        env:
          PGPASSWORD: tutoring

      - name: Run tests
        run: ./mvnw -B test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
