# Sobe o sistema completo com dados de exemplo: docker compose up --build
# Frontend: http://localhost:3000 | API: http://localhost:8080 | Postgres: localhost:5433
# Credenciais de desenvolvimento, só para este banco local (o banco real é outro).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutoring
      POSTGRES_USER: tutoring
      POSTGRES_PASSWORD: tutoring
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema e seed: rodam só na primeira subida (volume vazio)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutoring -d tutoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      # Sobrescrevem as propriedades do application.properties (que apontam para o Neon)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tutoring
      SPRING_DATASOURCE_USERNAME: tutoring
      SPRING_DATASOURCE_PASSWORD: tutoring
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
